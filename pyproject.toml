[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbp-pgl-runner"
version = "0.3.0"
description = "Digital Brain study preparation, PGL pilot execution, durable results and synchronization"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
experiment = ["pgl @ git+https://github.com/lobennett/pgl.git@128874a1940da7c75e4db554fdff28602d4f3985 ; sys_platform == 'darwin' and python_version >= '3.12'"]

[project.scripts]
dbp-pgl = "dbp_pgl_runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
