[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbp-api"
version = "0.2.0"
description = "Platform-independent Digital Brain Python API client"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
demo = ["jupyterlab>=4,<5", "pandas>=2,<3"]

[project.urls]
Repository = "https://github.com/lobennett/dbp-api"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dbp_api*"]

[tool.setuptools.package-data]
dbp_api = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
